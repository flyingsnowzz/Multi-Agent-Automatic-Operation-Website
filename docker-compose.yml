version: '3.8'

services:
  # PostgreSQL - 核心业务数据存储
  postgres:
    image: postgres:15-alpine
    container_name: multi_agent_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: multi_agent_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - multi_agent_network

  # MongoDB - 日志和向量数据
  mongodb:
    image: mongo:6.0
    container_name: multi_agent_mongodb
    environment:
      MONGO_INITDB_DATABASE: multi_agent_logs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - multi_agent_network

  # Redis - 缓存和任务队列
  redis:
    image: redis:7-alpine
    container_name: multi_agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - multi_agent_network

  # 可选：Qdrant 向量数据库（替代 Pinecone）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: multi_agent_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - multi_agent_network

  # 可选：MinIO 对象存储（替代 S3/OSS）
  minio:
    image: minio/minio:latest
    container_name: multi_agent_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    networks:
      - multi_agent_network

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  qdrant_data:
  minio_data:

networks:
  multi_agent_network:
    driver: bridge