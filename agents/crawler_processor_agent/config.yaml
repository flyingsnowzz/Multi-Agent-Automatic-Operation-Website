# CrawlerProcessorAgent 配置文件

# LLM 配置
llm:
  model: "deepseek-chat"  # ChatGPT: "gpt-4o"
  base_url: "https://api.deepseek.com"  # ChatGPT: 删除此行
  api_key: "${DEEPSEEK_API_KEY}"  # ChatGPT: "${OPENAI_API_KEY}"
  temperature: 0.3              # 低温度，确保评估一致性
  max_tokens: 2000              # 评估输出不需要太长
  fallback_model: "deepseek-chat"  # 备用模型（可选）

# 执行配置
execution:
  timeout_seconds: 300           # 单次处理超时（5分钟）
  max_retries: 2                # 失败重试次数
  retry_delay_seconds: 5         # 重试延迟
  require_approval: false        # Agent自主执行，无需人工审批
  llm_decision_enabled: false   # 是否允许 LLM 决策（仍需环境变量双闸门）

# 爬虫数据库配置（MySQL）
# 爬虫内容很多很杂（新闻/行业动态/竞品文章），需兼容多种字段结构
crawler_db:
  type: "mysql"                 # 数据库类型：mysql
  host: "${CRAWLER_DB_HOST}"
  port: "${CRAWLER_DB_PORT}"
  database: "crawler_db"
  table: "crawled_content"
  user: "${CRAWLER_DB_USER}"
  password: "${CRAWLER_DB_PASSWORD}"
  charset: "utf8mb4"            # MySQL 字符集
  status_field: "status"         # 状态字段名
  pending_status: "pending"      # 待处理状态值
  processed_status: "processed"  # 已处理状态值
  discard_status: "discarded"     # 丢弃状态值
  pass_to_scoring_status: "pass_to_scoring" # crawler 通过门禁后的目标状态
  pass_to_topic_status: "pass_to_topic"   # 历史兼容状态；已由 pass_to_scoring_status 替代
  # 通用字段映射（爬虫内容杂，字段名可能不统一）
  field_mapping:
    title: "title"              # 标题字段
    content: "content"           # 正文字段
    source_url: "source_url"     # 来源URL
    published_at: "published_at" # 发布时间（用于新闻类内容）
    author: "author"             # 作者
    category: "category"          # 分类/标签
    spider_name: "spider_name"   # 爬虫名称（用于识别内容来源）

# 已发布内容数据库配置（用于去重）
published_content_db:
  type: "mysql"                 # 数据库类型：mysql
  host: "${CMS_DB_HOST}"
  port: "${CMS_DB_PORT}"
  database: "cms_db"
  table: "articles"
  user: "${CMS_DB_USER}"
  password: "${CMS_DB_PASSWORD}"
  title_field: "title"
  content_field: "content"
  similarity_check_fields: ["title", "content"]  # 去重检查字段
  # NOTE: 爬虫内容很杂（新闻/行业动态/竞品文章），去重需同时检查 title + content

# 内容类型配置
content_types:
  diversity: true              # 内容多样，news/行业动态/竞品文章都覆盖
  type_detection: false       # 是否自动识别内容类型（暂不启用）
  type_weights:               # 各类型权重（用于评分调整）
    news: 0.9                 # 新闻时效性强，权重略高
    industry: 1.0             # 行业分析，基准权重
    competitor: 0.95          # 竞品文章，权重略高

# 去重配置
dedup:
  threshold: 0.8                 # 相似度阈值（0-1，越高越严格）
  algorithm: "cosine"            # 相似度算法：cosine/jaccard/levenshtein
  check_fields: ["title", "content"]  # 检查字段
  action_on_duplicate: "discard"  # 检测到重复时的动作：discard/mark_duplicate
  published_limit: 2000          # 去重库查询最近 N 条（性能可控）

# 内容评估标准
# NOTE:
# - crawler 当前正式职责是“门禁层”
# - crawler 只产生两类结果：discard / pass_to_scoring
# - 内容重要性、原文质量、publish/rewrite 分流不属于 crawler 职责
evaluation_criteria:
  material_score_threshold: 40   # 兼容字段；历史 material_score 总分阈值
  discard_below_score: 40         # 兼容字段；历史丢弃总分下限
  publish_candidate_threshold: 80 # 兼容字段；历史发布候选阈值，不再代表目标架构
  max_word_count: 5000            # 最大字数（超过则丢弃或截断）
  min_word_count: 80             # 最小字数（新闻可短至80字，但低于80基本无价值）
  input_required_fields: ["title", "content", "source_url"]  # 基础字段自检范围
  require_source_ok: true        # source_url 基础校验失败时直接 discard
  require_topic_hint: true       # 兼容字段；历史 Topic 候选链路要求
  source_summary_max_length: 220 # 兼容字段；历史 Topic 链路摘要长度上限
  # 短内容（80-300字）在规则评分中允许一定弹性，避免误判新闻快讯
  short_content_threshold: 300   # 短内容阈值
  short_content_bonus: 1.1       # 短内容质量加分系数
  min_base_relevance_score: 0.4  # 基础相关性门槛：是否属于目标内容池
  min_base_usability_score: 0.5  # 基础可用性门槛：是否具备进入下一层的最低条件
  require_content_complete: true # 内容残缺、采集异常或正文缺失时直接 discard
  max_noise_ratio: 0.35          # 高噪声内容上限（免责声明/相关推荐/跳转提示等占比）
  trusted_source_domains: []     # 可选可信域名白名单；不填则只校验 URL 基础格式

# 决策规则
decision_rules:
  # 丢弃条件（满足任一即丢弃：重复、风险、来源异常、不相关、不可用）
  discard_conditions:
    - "material_score < discard_below_score"   # 兼容字段
    - "is_duplicate == true"
    - "similarity_score >= 0.85"
    - "has_copyright_risk == true"
    - "source_ok == false"
    - "content_complete == false"
    - "noise_ratio > max_noise_ratio"
    - "base_relevance_score < min_base_relevance_score"
    - "base_usability_score < min_base_usability_score"
  # 历史三层分流规则仍保留为兼容注释；目标链路只保留 discard / pass_to_scoring
  tier_routing:
    discard: "未通过任一门禁条件"
    pass_to_scoring: "通过全部门禁条件"
  action_on_risk: "discard"  # 检测到版权/广告/垃圾风险时直接丢弃

# 日志配置
logging:
  level: "INFO"
  file: "logs/crawler_processor.log"
  max_bytes: 10485760           # 10MB
  backup_count: 5

# 监控指标
metrics:
  enable: true
  report_interval_seconds: 3600  # 每小时报告一次指标
  metrics_to_track:
    - "processed_count"           # 处理总数
    - "discard_count"             # 丢弃数量
    - "pass_to_scoring_count"     # 通过门禁并进入评分层的数量
    - "pass_to_topic_count"       # 历史兼容指标
    - "gate_pass_count"           # 通过门禁数量
    - "duplicate_count"           # 重复数量
    - "average_material_score"    # 历史兼容指标
    - "average_base_relevance_score"  # 平均基础相关性分
    - "average_base_usability_score"  # 平均基础可用性分
    - "average_processing_time"   # 平均处理时间
