# 竞品Agent配置
version: "1.0"

agent:
  name: "CompetitorAgent"
  display_name: "竞品分析师"
  description: "监控竞品内容，发现内容差距"

llm:
  provider: "openai"
  model: "deepseek-chat"  # ChatGPT: "gpt-4o"
  base_url: "https://api.deepseek.com"  # ChatGPT: 删除此行
  api_key: "${DEEPSEEK_API_KEY}"  # ChatGPT: "${OPENAI_API_KEY}"
  temperature: 0.4

# === 竞品列表 ===
competitors:
  - name: "竞品A"
    domain: "competitor-a.com"
    rss_url: "https://competitor-a.com/feed"
  - name: "竞品B"
    domain: "competitor-b.com"
    rss_url: "https://competitor-b.com/feed"

# === 监控配置 ===
monitoring:
  frequency: "daily"  # daily / weekly
  content_types: ["article", "guide", "tool"]
  metrics:
    - "new_content"
    - "top_performing"
    - "featured_snippets"

# === 输出配置 ===
output:
  output_fields:
    - "competitor_activity"
    - "content_gaps"
    - "differentiation_suggestions"
