# 图片Agent配置
# 版本: v1.0

version: "1.0"

agent:
  name: "ImageAgent"
  display_name: "配图设计师"
  description: "为文章生成和选择合适的配图，支持 DALL-E / Coze Site 双 Provider"

llm:
  provider: "openai"
  model: "deepseek-chat"  # ChatGPT: "gpt-4o"
  base_url: "https://api.deepseek.com"  # ChatGPT: 删除此行
  api_key: "${DEEPSEEK_API_KEY}"  # ChatGPT: "${OPENAI_API_KEY}"

# === 图片生成配置 ===
image_generation:
  # 图片生成服务
  provider: "${IMAGE_PROVIDER:-coze}"  # coze / openai / chatgpt / seedance
  visual_style: "professional"

  # OpenAI Images API 配置
  openai:
    model: "${IMAGE_OPENAI_MODEL:-gpt-image-1}"
    size: "${IMAGE_OPENAI_SIZE:-1024x1024}"
    quality: "${IMAGE_OPENAI_QUALITY:-standard}"
    response_format: "b64_json"
    api_style: ""

  # OpenAI-compatible Seedance/Seedream endpoint.
  # Fill SEEDANCE_BASE_URL / SEEDANCE_API_KEY in .env according to your provider account.
  seedance:
    base_url: "${SEEDANCE_BASE_URL}"
    api_key: "${SEEDANCE_API_KEY}"
    model: "${SEEDANCE_MODEL:-seedream-3-0-t2i-250415}"
    size: "${SEEDANCE_SIZE:-1024x1024}"
    quality: "${SEEDANCE_QUALITY:-standard}"

  # === Coze Site 配置 ===
  # 生图站点: https://gbfbffgpg6.coze.site/run
  # JWT Token: eyJhbGciOiJSUzI1NiIsImtpZCI6IjhmNTU2YTNkLWNkMDItNDQ0Zi05ZTBkLTI0NTU0ZTVkYmYyZCJ9...
  coze:
    endpoint: "https://gbfbffgpg6.coze.site/run"
    jwt_token: "${COZE_JWT_TOKEN}"
    cache_dir: "output/images/coze_cache"
    timeout: 120
    max_retries: 3
    download_images: true

  # Midjourney配置（预留）
  midjourney:
    enabled: false
    aspect_ratio: "16:9"
    style: "--style raw"

# === 图片需求 ===
image_requirements:
  featured_image:
    required: true
    min_width: 1200
    min_height: 630
    recommended_ratio: "1.91:1"

  inline_images:
    min: 1
    max: 4
    size: "1024x1024"
    style: "informative"

# === 图片优化 ===
optimization:
  compress_before_upload: true
  format: "webp"
  resize:
    enabled: true
    max_width: 1200
    quality: 85

# === Alt文本配置 ===
alt_text:
  max_length: 125
  include_keywords: true
  describe_visually: true
  describe_abstract: false

# === 输出配置 ===
output:
  output_fields:
    - "featured_image_url"
    - "featured_alt"
    - "featured_prompt"
    - "inline_images"
    - "license"
