# 选题Agent配置
# 版本: v1.0

version: "1.0"

# === Agent基础配置 ===
agent:
  name: "TopicAgent"
  display_name: "选题策划师"
  description: "发现高价值选题，挖掘用户搜索意图"

# === LLM配置 ===
llm:
  provider: "openai"  # openai / deepseek / anthropic
  model: "gpt-4o"  # 主力模型
  temperature: 0.7  # 创造性适度
  max_tokens: 4000
  
  # 备选模型（用于成本优化）
  fallback:
    enabled: true
    model: "deepseek-chat"
    use_for_simple_tasks: true

# === 选题参数 ===
topic:
  # 关键词难度范围 (0-100)
  keyword_difficulty:
    min: 0
    max: 35  # 初创期建议35以下
  
  # 搜索量要求
  search_volume:
    min: 100  # 最小月搜索量
    preferred: 500  # 理想月搜索量
  
  # 选题数量
  output:
    min: 5
    max: 10
    prioritize_diversity: true  # 优先保证多样性
  
  # 内容类型偏好
  content_types:
    - "how_to"  # 操作指南
    - "guide"   # 教程指南
    - "list"    # 列表文章
    - "comparison"  # 对比文章
    - "case_study"  # 案例分析
    - "opinion"     # 观点文章
  
  # 标题长度
  title:
    min_length: 15
    max_length: 60
    include_numbers: true  # 标题中包含数字（如"5个技巧"）

# === 关键词研究配置 ===
keyword_research:
  # 数据源优先级
  sources:
    - "google_keyword_planner"
    - "ahrefs"
    - "semrush"
    - "baidu_index"
  
  # 关键词筛选规则
  filters:
    exclude:
      - "价格"  # 排除价格类关键词（除非专门做定价页）
      - "多少钱"  # 排除问价类
      - "招聘"   # 排除招聘类
      - "兼职"   # 排除兼职类
      - "技巧"
      - "方法"
      - "工具"
    
    prefer:
      - "报考条件"
      - "申请流程"
      - "院校"
      - "怎么选"
      - "区别"
      - "学费"
      - "回报"
      - "课程"
      - "价值"
      - "适合"
      - "值得"
      - "指南"
      - "流程"
  
  # 关键词分类
  categories:
    - name: "信息型"
      intent: "informational"
      examples: ["如何选择EMBA", "EMBA报考条件"]
    - name: "导航型"
      intent: "navigational"
      examples: ["清华经管EMBA官网", "北大光华MBA"]
    - name: "交易型"
      intent: "transactional"
      examples: ["EMBA报名", "MBA培训班"]

# === 趋势检测配置 ===
trends:
  # 趋势数据源
  sources:
    - "google_trends"
    - "baidu_index"
    - "weibo_hot"
    - "zhihu_hot"
  
  # 趋势窗口期
  time_windows:
    - "today"  # 当日热点
    - "7d"     # 7天趋势
    - "30d"    # 30天趋势
    - "90d"    # 季度趋势
  
  # 趋势选题阈值
  thresholds:
    min_trending_score: 50  # 最低热度分数
    min_rising_keywords: 3  # 最少上升关键词数

# === 竞品分析配置 ===
competitor:
  # 分析竞品哪些内容
  analysis:
    - "new_content"      # 新发布内容
    - "top_performing"   # 高表现内容
    - "featured_snippets" # 精选摘要内容
    - "content_gaps"     # 内容差距（竞品有我们没有的）
  
  # 竞品列表
  competitors:
    - name: "竞品A"
      domain: "competitor-a.com"
    - name: "竞品B"
      domain: "competitor-b.com"
  
  # 内容差距检测
  gap_detection:
    enabled: true
    min_gap_score: 70  # 差距分数阈值

# === 输出配置 ===
output:
  # 输出格式
  format: "structured"
  
  # 每个选题包含的字段
  topic_fields:
    - "id"              # 选题ID
    - "title"           # 标题建议
    - "target_keywords" # 目标关键词（可多个）
    - "search_volume"   # 预估搜索量
    - "keyword_difficulty"  # 关键词难度
    - "competition_level"   # 竞争水平 (low/medium/high)
    - "content_type"    # 内容类型
    - "search_intent"   # 搜索意图
    - "outline_points" # 大纲要点（简略）
    - "priority"        # 优先级 (high/medium/low)
    - "reason"          # 推荐理由
    - "estimated_difficulty"  # 写作难度预估
    - "data_sources"    # 数据来源
  
  # 优先级计算权重
  priority_weights:
    search_volume: 0.3
    keyword_difficulty: 0.25
    competition_gap: 0.2
    trending_score: 0.15
    strategic_value: 0.1

# === 候选素材筛选与路由 ===
candidate_screening:
  min_priority_score: 35.0  # 最低选题推荐分
  require_search_intent: true  # 必须具有搜索意图
  require_business_relevance: true  # 必须具备商学相关性

workflow_routes:
  rewrite_candidate: "full_rewrite_flow"
  publish_candidate: "light_publish_flow"

candidate_status:
  accepted: "topic_accepted"
  rejected: "topic_rejected"

# === Crawler文章评分 ===
# 流程：遍历 crawler 文章 -> 抽取解释性 topics -> 按文章维度评分 -> 输出文章列表。
# 注意：topics 只作为解释字段，不做 topic 排名，也不参与综合分。
crawler_article_scoring:
  ai_scoring:
    enabled: true
    provider: "openai_compatible"
    model: "gpt-4o-mini"
    base_url: "https://api.openai.com/v1"
    timeout: 30
    concurrency: 1  # 大批量跑分可调到 4-8，视 API 限速而定

  article_score_weights:
    title_style_score:
      weight: 0.25
      description: "AI标题风格分，越新颖、越不同质化分越高"
    notice_score:
      weight: 0.05
      description: "AI判断是否通知；通知/公告类为0分，新闻/动态/解读类为100分"
    content_importance_score:
      weight: 0.60
      description: "AI阅读全文后的原始内容重要性分乘以时效系数后的分数"
    freshness_score:
      weight: 0.10
      description: "时效性分；两个月内不参与综合分，旧文触发惩罚"

  topic_rules:
    招生简章: ["招生简章", "招生章程", "招生专业目录", "招生目录"]
    报考条件: ["报考条件", "报名条件", "申请条件", "报考资格"]
    报名流程: ["报名", "网上报名", "报名流程", "报名时间", "入口"]
    复试录取: ["复试", "录取", "拟录取", "复试名单", "录取名单"]
    调剂信息: ["调剂", "调剂公告", "调剂系统", "调剂名额"]
    考试大纲: ["考试大纲", "考试科目", "参考书目", "初试", "笔试"]
    学费学制: ["学费", "学制", "奖学金", "培养费用"]
    项目介绍: ["项目介绍", "专业介绍", "培养方案", "课程设置"]
    院校动态: ["通知", "公告", "新闻", "动态", "讲座"]
    中外合作: ["中外合作", "国际项目", "合作办学", "留学"]

# === 执行控制 ===
execution:
  # Agent自主执行，无需人工审批
  require_approval: false  # 自主运营，Agent全流程执行，无需人工审批
  mode: "mock"  # mock / live
  
  # 执行超时（秒）
  timeout: 300

# === 质量控制 ===
quality:
  # 最低质量分数
  min_quality_score: 60
  
  # 重复检测
  duplicate_check:
    enabled: true
    similarity_threshold: 0.7  # 相似度阈值
  
  # 标题质量检查
  title_quality:
    check_seo_friendly: true
    check_clickworthy: true
    check_clear_intent: true

quality_gates:
  semantic_min_score: 70
  keyword_min_len: 4
  title_min_len: 12

business_semantics:
  industry: "高管教育/EMBA/商学院"
  target_audience:
    - "企业高管"
    - "企业管理者"
    - "创业者"
    - "准备申请EMBA的人群"
  preferred_topic_angles:
    - "报考条件"
    - "申请流程"
    - "院校选择"
    - "EMBA与MBA区别"
    - "课程价值"
    - "职业发展"
    - "管理能力提升"
    - "学费与回报"
    - "适合人群"
  forbidden_patterns:
    - "怎么EMBA"
    - "如何EMBA"
    - "EMBA技巧"
    - "EMBA 方法"
    - "EMBA方法"
    - "EMBA 工具"
    - "EMBA工具"

# === 日志配置 ===
logging:
  level: "INFO"
  save_outputs: true
  output_dir: "logs/topic_agent"
