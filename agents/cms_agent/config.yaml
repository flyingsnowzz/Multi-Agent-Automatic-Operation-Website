# CMS Agent配置
# 版本: v1.0

version: "1.0"

# === Agent基础配置 ===
agent:
  name: "CMSAgent"
  display_name: "CMS发布员"
  description: "将文章发布到CMS系统"

# === LLM配置 ===
# 当前 `cms_agent.py` 未直接消费此配置块，暂保留用于历史兼容与后续收口。
llm:
  provider: "openai"
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 2000
  
  fallback:
    enabled: true
    model: "deepseek-chat"

# === CMS配置 ===
cms:
  provider: "custom"  # custom / wordpress / ghost / strapi
  
  # 自定义CMS API
  api:
    base_url: "${CMS_API_URL}"
    api_key: "${CMS_API_KEY}"
    version: ""

  # custom CMS 实际接口约定
  custom:
    auth_header: "BFF-HMAC-SHA256"
    endpoints:
      login: "/auth/login"
      posts: "/v2/article/publish"
      media: "/v2/article/upload-image"
      categories: "/categories"
      tags: "/tags"
    post_contract:
      body_format: "json"
      content_field: "content"
      preserve_markdown_field: "content_md"
      request:
        create_post_path: "/v2/article/publish"
        media_upload_path: "/v2/article/upload-image"
        category_path: "/categories"
        tags_path: "/tags"
        slug_query_param: "slug"
      required_fields:
        - "title"
        - "content"
      meta_field: "meta"
      status_mapping:
        draft: "draft"
        publish: "publish"
        scheduled: "scheduled"
      response_paths:
        id:
          - "data.articleid"
          - "articleid"
          - "id"
          - "data.id"
        url:
          - "url"
          - "link"
          - "article_url"
          - "web_url"
          - "data.article_url"
          - "data.web_url"
          - "data.url"
          - "data.link"
        status:
          - "status"
          - "data.status"
        slug:
          - "slug"
          - "data.slug"
      media_response_paths:
        id:
          - "id"
          - "data.id"
        url:
          - "url"
          - "data.url"
      error_paths:
        - "error"
        - "message"
        - "detail"
  
  # WordPress配置（如果使用WP）
  wordpress:
    enabled: false
    rest_api_base: "https://example.com/wp-json/wp/v2"
    auth: "basic"  # basic / oauth
  
  # Ghost配置（如果使用Ghost）
  ghost:
    enabled: false
    admin_api_base: "https://example.com/ghost/api/admin"
    content_api_key: "${GHOST_CONTENT_KEY}"

# === 发布流程 ===
publishing:
  dry_run: false
  slug_check_in_dry_run: false  # dry-run 默认不做远程 slug 检查；开启后才允许读取 CMS 预检冲突
  # 发布模式
  mode: "publish"  # 仅允许 draft / scheduled / immediate / publish；非法值会被本地拦截为 publish_blocked

  # slug 冲突策略：auto_rewrite / overwrite_update / fail
  slug_conflict:
    strategy: "auto_rewrite"
    max_rewrite_attempts: 10
  
  # 定时发布
  scheduled:
    enabled: false
    timezone: "Asia/Shanghai"
    default_time: "09:00"  # 兼容旧配置；正式排期优先用 .env 的 CMS_SCHEDULE_TIMES
    times: ["09:00", "13:00", "18:00"]  # 一天发几次，由时间点数量决定
    per_slot: 2  # 每个时间点发几篇
  
  # 自动发布检查
  # 当前 `cms_agent.py` 未直接消费该配置，真实发布仍以 dry_run + 环境变量双闸门控制。
  auto_publish:
    enabled: false  # 需要人工确认
  
  # 发布前验证
  pre_publish_check:
    # `title_not_empty` 为代码内建必校验，这里保留在配置中以对齐文档与审计口径。
    - "title_not_empty"
    - "content_not_empty"
    - "slug_not_empty"
    - "status_valid"
    - "category_assigned"
    - "featured_image_set"
    - "slug_unique"

  # 批量发布建议配置；当前代码未实现批量调度，仅作为运营侧建议说明。
  batch_size: 10
  concurrency_limit: 3
  retry_backoff_seconds: 60

# === 内容映射 ===
content_mapping:
  # 文章字段映射
  fields:
    title: "title"
    content: "content"
    excerpt: "meta_description"
    slug: "slug"
    date: "published_date"
    author: "author"
  
  # 分类映射
  category_mapping:
    "emba": "emba-guide"
    "mba": "mba-guide"
    "ee": "executive-education"
  
  # 标签策略
  tags:
    auto_generate: true       # 自动从关键词生成标签
    max_tags: 5              # 最多5个标签
    use_primary_keyword: true  # 主关键词作为标签

# === 图片处理 ===
images:
  upload_to_cms: true  # 是否上传到CMS
  upload_failure_strategy: "fail"  # fail / use_original_url
  
  # 图片优化
  optimization:
    max_width: 1200
    max_height: 800
    quality: 85
    format: "webp"  # webp / jpg / png
  
  # Featured Image
  featured_image:
    required: true
    min_width: 1200
    min_height: 630
    source: "ai_generated"  # ai_generated / stock / manual

# === URL结构 ===
url:
  base_url: "https://example.com"
  
  # URL规则
  rules:
    category_prefix: false    # 是否加分类前缀
    date_prefix: false       # 是否加日期前缀
    trailing_slash: true
  
  # Slug生成规则
  slug:
    max_length: 60
    separator: "-"
    lowercase: true
    remove_stopwords: true   # 删除停用词

# === SEO字段 ===
seo_fields:
  # WordPress provider 下由 CMSClient 映射到 SEO 插件字段；CMSAgent 不直接拼 Yoast/RankMath meta
  yoast_compatible: false   # Yoast SEO字段
  rankmath_compatible: false  # Rank Math字段
  
  fields:
    seo_title: "meta_title"
    seo_description: "meta_description"
    focus_keyword: "primary_keyword"

# === 输出配置 ===
output:
  format: "structured"
  
  output_fields:
    - "article_id"      # CMS文章ID
    - "article_url"    # 文章URL
    - "status"         # 发布状态
    - "published_at"   # 发布时间

# === 执行控制 ===
# 当前 `require_approval` 未被 `cms_agent.py` 直接消费，暂保留用于配置兼容。
execution:
  require_approval: false  # 自主运营，无需人工审批
  
  # 重试机制
  retry:
    enabled: true
    max_retries: 3
    delay_seconds: 60
  
  timeout: 120

# === 质量控制 ===
# 当前质量控制配置块未被 `cms_agent.py` 直接消费，暂保留用于历史兼容。
quality:
  # 发布前检查清单
  pre_publish:
    - name: "内容完整性"
      check: "content_length >= 800"
    - name: "分类设置"
      check: "category != null"
    - name: "URL唯一性"
      check: "slug_unique"

# === 日志配置 ===
logging:
  level: "INFO"
  save_publish_history: true
  output_dir: "logs/cms_agent"
