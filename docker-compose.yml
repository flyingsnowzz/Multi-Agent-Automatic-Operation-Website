version: '3.8'

services:
  # Production article pipeline: LangGraph batch runner.
  # Default command is dry-run CMS publishing. Add --publish through
  # LANGGRAPH_ARGS only after CMS_ENABLE_REAL_PUBLISH=true and CMS credentials
  # are ready.
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi_agent_pipeline
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${PIPELINE_MYSQL_HOST:-mysql}
      MYSQL_PORT: ${PIPELINE_MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-multi_agent_cms}
      RESEARCH_MYSQL_DATABASE: ${RESEARCH_MYSQL_DATABASE:-research_article_data}
      PROMPT_AUDIT_LOG_DIR: /app/logs/prompt_audit
      AI_SCORE_THRESHOLD: ${AI_SCORE_THRESHOLD:-75}
      QUALITY_PASS_THRESHOLD: ${QUALITY_PASS_THRESHOLD:-70}
      REWRITE_QUALITY_THRESHOLD: ${REWRITE_QUALITY_THRESHOLD:-70}
      LANGGRAPH_BATCH_LIMIT: ${LANGGRAPH_BATCH_LIMIT:-30}
      LANGGRAPH_LOOP_INTERVAL_SECONDS: ${LANGGRAPH_LOOP_INTERVAL_SECONDS:-60}
      LANGGRAPH_SCORING_AI_CONCURRENCY: ${LANGGRAPH_SCORING_AI_CONCURRENCY:-4}
      LANGGRAPH_FEED_EXISTING: ${LANGGRAPH_FEED_EXISTING:-true}
      LANGGRAPH_FEED_FROM_ID: ${LANGGRAPH_FEED_FROM_ID:-0}
      LANGGRAPH_FEED_STATE_PATH: ${LANGGRAPH_FEED_STATE_PATH:-output/langgraph_feeder_state.json}
      LANGGRAPH_DEADLETTER_PATH: ${LANGGRAPH_DEADLETTER_PATH:-output/langgraph_deadletter.jsonl}
    command: >
      sh -lc "python3 scripts/run_langgraph_batch.py --production ${LANGGRAPH_ARGS:-}"
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -m py_compile scripts/run_langgraph_batch.py workflows/langgraph_article_pipeline.py"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    networks:
      - multi_agent_network

  # MySQL - business article database used by the LangGraph pipeline.
  mysql:
    image: mysql:8.0
    container_name: multi_agent_mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-mysql}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-multi_agent_cms}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/docker-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - multi_agent_network

  # PostgreSQL - optional auxiliary storage. The article pipeline reads business
  # articles from MySQL.
  postgres:
    image: postgres:15-alpine
    container_name: multi_agent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-multi_agent_cms}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - multi_agent_network

  # MongoDB - 日志和向量数据
  mongodb:
    image: mongo:6.0
    container_name: multi_agent_mongodb
    environment:
      MONGO_INITDB_DATABASE: multi_agent_logs
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - multi_agent_network

  # 可选：Qdrant 向量数据库（替代 Pinecone）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: multi_agent_qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - multi_agent_network

  # 可选：MinIO 对象存储（替代 S3/OSS）
  minio:
    image: minio/minio:latest
    container_name: multi_agent_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    command: server /data --console-address ":9001"
    networks:
      - multi_agent_network

volumes:
  mysql_data:
  postgres_data:
  mongo_data:
  qdrant_data:
  minio_data:

networks:
  multi_agent_network:
    driver: bridge
