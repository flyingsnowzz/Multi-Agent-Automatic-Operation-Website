# EditorAgent 配置 v2.0
version: "2.0"

agent:
  name: "EditorAgent"
  display_name: "发布前编辑器"
  description: "错别字修正 + 政治审查 + MD→HTML + 图片占位 + 敏感词过滤"

llm:
  enabled: true
  provider: "openai"
  model: "deepseek-chat"
  base_url: "${EDITOR_LLM_BASE_URL:-https://api.deepseek.com}"
  temperature: 0.2
  timeout: 120

grammar:
  enabled: true
  language: "chinese"

safety:
  min_word_len: 2

images:
  placeholder_marker: "{IMG: ...}"
  figure_class: "article-image"

logging:
  level: "INFO"
  save_outputs: true
  output_dir: "logs/editor_agent"
